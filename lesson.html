<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson · Mathematics in Motion</title>
  <meta name="description" content="An animated mathematics lesson with practice questions marked with feedback.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/webp" href="assets/img/logo.webp">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .working { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; }
    .working textarea { width: 100%; min-height: 90px; font: inherit; padding: 10px 12px; border: 1px solid var(--ink-3); border-radius: 8px; }
    .working .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .working input[type=file] { font: inherit; font-size: .85rem; max-width: 100%; }
    .working .preview { max-height: 120px; border-radius: 8px; border: 1px solid var(--line); display: none; }
    .marking { margin-top: 10px; padding: 12px 14px; border-radius: 8px; background: var(--panel); display: none; }
    .marking.show { display: block; }
    .marking.correct { background: var(--ok-soft); } .marking.partly { background: var(--warn-soft); } .marking.incorrect { background: #fdecec; }
    .marking strong { display: block; margin-bottom: 4px; }
    .kind { font-size: .78rem; font-weight: 600; color: var(--blue-dark); background: var(--blue-chip); border-radius: 24px; padding: 2px 10px; margin-left: 8px; }
    .locked-note { background: var(--blue-soft); border-radius: var(--radius); padding: 20px; }
  </style>
</head>
<body>
  <!--HEADER-->
  <header class="site-header">
    <div class="wrap">
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <a class="brand" href="index.html"><img src="assets/img/logo.webp" alt="" class="brand-logo">Mathematics in Motion</a>
      <nav class="nav" id="nav" aria-label="Main">
        <a href="lessons.html">Lessons</a>
        <a href="test.html">Tests</a>
        <a href="about.html">About</a>
      </nav>
      <div class="header-right">
        <form class="search" action="lessons.html" method="get" role="search"><label class="sr-only" for="q">Search lessons</label><input id="q" name="q" type="search" placeholder="What do you want to learn?"><button type="submit" aria-label="Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button></form>
        <a class="btn btn-outline btn-sm" href="admin.html">Author sign-in</a>
      </div>
    </div>
  </header>
  <!--/HEADER-->

  <main id="lesson" class="player">
    <div class="stage"><p class="muted">Loading lesson…</p></div>
  </main>

  <script src="assets/config.js"></script>
  <script src="content/lessons.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/site.js"></script>
  <script src="assets/help.js"></script>
  <script>
  (function () {
    var esc = MIM.esc;
    var main = document.getElementById('lesson');
    var LABEL = { video: 'Video', reading: 'Reading', practice: 'Practice' };
    var IC = {
      video: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5z" fill="currentColor" stroke="none"/></svg>',
      reading: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg>',
      practice: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 12 2.5 2.5L16 9"/></svg>',
      done: '<svg class="ic done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" fill="currentColor" stroke="none"/><path d="m8 12 2.5 2.5L16 9" stroke="#fff"/></svg>',
      lock: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
      caret: '<svg class="m-caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>'
    };

    function itemsFor(l) {
      var out = [{ key: 'video', title: 'Watch: ' + l.title, meta: MIM.hasVideo(l) ? 'Video · ' + (l.duration || '') : 'Video · coming soon' },
                 { key: 'reading', title: 'Read: the idea', meta: 'Reading · 2 min' }];
      if ((l.questions || []).length) out.push({ key: 'practice', title: 'Practice: ' + l.title, meta: 'Practice · ' + l.questions.length + ' questions · pass at 80%' });
      return out;
    }
    // Items inside a lesson open in order: video, then reading, then practice.
    function itemUnlocked(l, key) {
      if (key === 'video') return true;
      if (key === 'reading') return MIM.isDone(l.slug, 'video');
      return MIM.isDone(l.slug, 'reading');
    }
    function href(l, item) { return 'lesson.html?id=' + encodeURIComponent(l.slug) + '&item=' + item; }

    function outline(current, item, chapterLessons, chapterName, all) {
      var total = 0, done = 0;
      chapterLessons.forEach(function (l) { if (l.status === 'live') itemsFor(l).forEach(function (it) { total++; if (MIM.isDone(l.slug, it.key)) done++; }); });
      var pct = total ? Math.round(done / total * 100) : 0;
      var html = '<aside class="outline" id="outline"><div class="outline-head"><div class="eyebrow">Course material</div><h2>' + esc(chapterName) + '</h2>' +
        '<div class="progress"><span style="width:' + pct + '%"></span></div><span class="small muted">' + done + ' of ' + total + ' items completed</span></div>';
      chapterLessons.forEach(function (l) {
        var live = l.status === 'live', unlocked = MIM.isUnlocked(l, all), open = l.slug === current.slug;
        html += '<details class="module-group' + (unlocked ? '' : ' locked') + '"' + (open ? ' open' : '') + '><summary>' + (unlocked ? '' : IC.lock) +
          '<span>Lesson ' + esc(l.number) + ': ' + esc(l.title) + '<span class="m-sub">' + (!live ? 'Coming soon' : unlocked ? (MIM.lessonDone(l) ? 'Completed' : itemsFor(l).length + ' items') : 'Finish lesson ' + esc((MIM.previousLesson(l, all) || {}).number || '') + ' first') + '</span></span>' + (unlocked ? IC.caret : '') + '</summary>';
        if (unlocked) itemsFor(l).forEach(function (it) {
          var cur = open && it.key === item, ok = itemUnlocked(l, it.key);
          html += '<a class="item' + (cur ? ' current' : '') + (ok ? '' : ' locked') + '" href="' + href(l, it.key) + '">' + (MIM.isDone(l.slug, it.key) ? IC.done : ok ? IC[it.key] : IC.lock) +
            '<span>' + esc(it.title) + '<span class="meta">' + esc(it.meta) + '</span></span></a>';
        });
        html += '</details>';
      });
      return html + '</aside>';
    }

    function figure(src, alt) { return src ? '<div class="figure"><img src="' + esc(src) + '" alt="' + esc(alt) + '" loading="lazy"></div>' : ''; }

    function videoView(l) {
      var has = MIM.hasVideo(l);
      return '<div class="video-frame" data-video-id="' + esc(l.video_id || '') + '" data-video-title="' + esc(l.title) + '"><div class="video-placeholder"><div><div class="play"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#fff"/></svg></div><strong>' + esc(l.title) + '</strong>' + (has ? '' : '<p class="small" style="opacity:.8;margin:.4em 0 0">The video for this lesson has not been linked yet.</p>') + '</div></div></div>' +
        (l.hook ? '<p style="margin-top:18px;font-size:1.05rem">' + esc(l.hook) + '</p>' : '') +
        '<p class="muted small">Watch it through: the first practice question uses numbers from this video.' + (has ? ' Watch on <a href="https://www.youtube.com/watch?v=' + esc(l.video_id) + '" target="_blank" rel="noopener">YouTube</a> if the player does not load.' : '') + '</p>';
    }

    function readingView(l) {
      var outcomes = MIM.lines(l.outcomes), skills = MIM.csv(l.skills);
      return '<div class="reading">' +
        (outcomes.length ? '<div class="info-box" style="margin:0 0 20px"><h3>In this lesson you learn</h3><ul class="outcomes">' + outcomes.map(function (o) { return '<li>' + esc(o) + '</li>'; }).join('') + '</ul></div>' : '') +
        (l.theorem ? '<blockquote>' + esc(l.theorem) + '</blockquote>' : '') +
        '<div class="idea"><div>' + (l.explanation ? '<p>' + esc(l.explanation) + '</p>' : '<p class="muted">Not written yet.</p>') + '</div>' + figure(l.figure, 'Figure for ' + l.title) + '</div>' +
        (skills.length ? '<div class="info-box"><h3>Skills you\'ll gain</h3><div class="chips">' + skills.map(function (s) { return '<span class="chip">' + esc(s) + '</span>'; }).join('') + '</div></div>' : '') +
        '<div class="info-box"><h3>In the syllabus</h3><p class="small" style="margin:0">' +
        (l.syllabus_topic ? '<strong>Topic ' + esc(l.syllabus_topic) + ' · ' + esc(l.topic) + '</strong>' + (l.syllabus_subtopic ? ' · ' + esc(l.syllabus_subtopic) : '') + (l.syllabus_form ? ' · ' + esc(l.syllabus_form) : '') + '<br>' : '') +
        (l.syllabus_objective ? esc(l.syllabus_objective) + '<br>' : '') +
        '<span class="muted">ZIMSEC Mathematics Syllabus B, Forms 1 to 4 (2024 to 2030).' + (l.textbook_ref ? ' Textbook: ' + esc(l.textbook_ref) + '.' : '') + ' <a href="syllabus.html#topic-' + esc(l.syllabus_topic) + '">Full topic</a>.</span></p></div></div>';
    }

    function question(q, i) {
      var id = 'q' + (i + 1);
      var unit = q.unit === '°' ? '°' : (q.unit ? ' ' + esc(q.unit) : '');
      return '<div class="question" data-answer="' + esc(q.answer) + '" data-tolerance="' + esc(q.tolerance == null ? 0.01 : q.tolerance) + '" data-hint="' + esc(q.hint) + '" data-index="' + i + '">' +
        '<span class="points">1 point</span><div class="eyebrow">Question ' + (i + 1) + (q.kind === 'video_check' ? '<span class="kind">From the video</span>' : '') + '</div>' +
        '<div class="question-grid"><div><p>' + esc(q.prompt) + '</p>' +
        '<div class="answer-row"><label class="sr-only" for="' + id + '">Your answer</label><input id="' + id + '" inputmode="decimal" placeholder="?">' + unit +
        '<button class="btn btn-primary btn-sm" type="button">Check</button></div>' +
        '<div class="feedback" role="status"></div>' +
        '<div class="working"><label class="small" for="' + id + '-w"><strong>Show your working</strong> (type it, or add a photo of your page) and get it marked</label>' +
        '<textarea id="' + id + '-w" placeholder="e.g. tan θ = 10 ÷ 15 = 0.667, θ = tan⁻¹(0.667) = 33.7°"></textarea>' +
        '<div class="row"><input type="file" accept="image/*" capture="environment" aria-label="Photo of your working"><img class="preview" alt="Your photo"><button class="btn btn-outline btn-sm" type="button" data-mark>Mark my working</button></div>' +
        '<div class="marking" role="status"></div></div>' +
        (q.solution ? '<details class="solution"><summary>Worked solution</summary><p>' + esc(q.solution) + '</p></details>' : '') +
        '</div>' + figure(q.figure, 'Figure for question ' + (i + 1)) + '</div></div>';
    }

    function practiceView(l) {
      var n = l.questions.length;
      return '<div class="quiz-head"><span class="muted small">' + n + ' questions · pass at 80% to open the next lesson · Type the answer and press Check, or get your working marked. A hint appears after a miss, the worked solution after two.</span></div>' +
        l.questions.map(question).join('') +
        '<div class="grade" data-score><div class="pct"><span data-score-correct>0</span>/' + n + '</div><div><strong>Your grade</strong><div class="muted" data-score-message>Answer every question to see your grade.</div></div><button class="btn btn-ghost btn-sm" type="button" id="retry" style="margin-left:auto">Try again</button></div>' +
        '<p class="muted small" style="margin:10px 0 0">Progress is saved in this browser only.</p>';
    }

    // Photo -> downscaled JPEG base64 for marking
    function fileToImage(file) {
      return new Promise(function (resolve, reject) {
        var img = new Image(); var url = URL.createObjectURL(file);
        img.onload = function () {
          var max = 1400, s = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          resolve({ media_type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
        };
        img.onerror = function () { reject(new Error('Could not read that image.')); };
        img.src = url;
      });
    }

    function mountMarking(l, onCorrect) {
      document.querySelectorAll('.question').forEach(function (qEl) {
        var i = parseInt(qEl.getAttribute('data-index'), 10), q = l.questions[i];
        var file = qEl.querySelector('input[type=file]'), prev = qEl.querySelector('.preview'), btn = qEl.querySelector('[data-mark]'), box = qEl.querySelector('.marking'), ta = qEl.querySelector('textarea');
        var image = null;
        file.addEventListener('change', function () {
          if (!file.files[0]) return;
          fileToImage(file.files[0]).then(function (im) { image = im; prev.src = 'data:image/jpeg;base64,' + im.data; prev.style.display = 'block'; }).catch(function (e) { box.className = 'marking show'; box.textContent = e.message; });
        });
        btn.addEventListener('click', function () {
          if (!ta.value.trim() && !image) { box.className = 'marking show'; box.textContent = 'Type your working or add a photo first.'; return; }
          btn.disabled = true; box.className = 'marking show'; box.textContent = 'Marking… about 20 seconds.';
          MIM.assist({ mode: 'mark', question: { prompt: q.prompt, answer: q.answer, tolerance: q.tolerance, unit: q.unit, solution: q.solution }, working: ta.value.trim(), image: image, student_answer: qEl.querySelector('input').value })
            .then(function (r) {
              box.className = 'marking show ' + (r.verdict === 'correct' ? 'correct' : r.verdict === 'partly' ? 'partly' : 'incorrect');
              box.innerHTML = '<strong>' + ({ correct: 'Correct', partly: 'Nearly there', incorrect: 'Not yet', unreadable: 'Could not read it' })[r.verdict] + ' · ' + Math.round((r.score || 0) * 100) + '%</strong>' + esc(r.feedback) + '<br><em>' + esc(r.next_step) + '</em>';
              if (r.verdict === 'correct') onCorrect(qEl);
            })
            .catch(function (e) { box.className = 'marking show'; box.textContent = e.message || 'Marking failed.'; })
            .then(function () { btn.disabled = false; });
        });
      });
    }

    function render(l, all) {
      var item = MIM.param('item');
      var items = itemsFor(l);
      if (!items.some(function (it) { return it.key === item; })) item = items[0].key;
      var chapterName = l.chapter || l.topic || 'Lessons';
      var chapterLessons = all.filter(function (x) { return x.syllabus_topic === l.syllabus_topic && x.status !== 'draft'; });
      document.title = l.title + ' · Mathematics in Motion';
      window.MIM_LESSON_CONTEXT = { number: l.number, title: l.title, theorem: l.theorem, explanation: l.explanation, questions: (l.questions || []).map(function (q) { return { prompt: q.prompt }; }) };

      var html = outline(l, item, chapterLessons, chapterName, all) + '<div class="stage">' +
        '<button class="btn btn-ghost btn-sm outline-toggle" type="button" id="outline-toggle">☰ Course material</button>' +
        '<div class="crumbs" style="padding:0 0 8px"><a href="lessons.html">Lessons</a><span class="sep">›</span><a href="lessons.html?topic=' + encodeURIComponent(l.topic || '') + '">' + esc(chapterName) + '</a><span class="sep">›</span><span>Lesson ' + esc(l.number) + '</span></div>';

      // Locked lesson or locked item
      if (!MIM.isUnlocked(l, all)) {
        var prev = MIM.previousLesson(l, all);
        html += '<div class="stage-head"><h1>' + esc(l.title) + '</h1></div><div class="locked-note"><strong>This lesson opens after lesson ' + esc(prev ? prev.number : '') + '.</strong><p class="muted" style="margin:6px 0 12px">Lessons in a topic build on each other, so finish the practice of the lesson before this one first.</p>' +
          (prev ? '<a class="btn btn-primary" href="' + href(prev, 'video') + '">Go to lesson ' + esc(prev.number) + ': ' + esc(prev.title) + '</a>' : '') + '</div></div>';
        main.innerHTML = html; wireOutline(); return;
      }
      if (!itemUnlocked(l, item)) {
        var need = item === 'practice' ? 'reading' : 'video';
        html += '<div class="stage-head"><h1>' + esc(items.filter(function (it) { return it.key === item; })[0].title) + '</h1></div><div class="locked-note"><strong>First finish the ' + (need === 'video' ? 'video' : 'reading') + '.</strong><p class="muted" style="margin:6px 0 12px">Work through the lesson in order: watch, read, then practise.</p><a class="btn btn-primary" href="' + href(l, need) + '">Go to the ' + need + '</a></div></div>';
        main.innerHTML = html; wireOutline(); return;
      }

      var idx = items.map(function (it) { return it.key; }).indexOf(item), it = items[idx];
      var prevHref = idx > 0 ? href(l, items[idx - 1].key) : '';
      var nextHref = idx < items.length - 1 ? href(l, items[idx + 1].key) : '';
      var nextLesson = null;
      if (!nextHref) { var after = chapterLessons.filter(function (x) { return x.status === 'live' && MIM.numKey(x.number) > MIM.numKey(l.number); })[0]; if (after) { nextLesson = after; nextHref = href(after, 'video'); } }
      var done = MIM.isDone(l.slug, item);
      var body = item === 'video' ? videoView(l) : item === 'reading' ? readingView(l) : practiceView(l);

      html += '<div class="stage-head"><div class="eyebrow">' + esc(LABEL[item]) + ' · ' + esc(it.meta.split('·').slice(1).join('·').trim()) + '</div><h1>' + esc(it.title) + '</h1>' +
        '<div class="instructor" style="margin:6px 0 0"><span class="avatar">JH</span><span class="small"><strong>Jephias Hadzina</strong> · Mathematics in Motion</span></div></div>' + body +
        '<div class="stage-nav"><div>' + (prevHref ? '<a class="btn btn-ghost" href="' + prevHref + '">← Previous</a>' : '') + '</div><div style="display:flex;gap:10px;flex-wrap:wrap">' +
        (item !== 'practice' ? '<button class="btn ' + (done ? 'btn-ghost' : 'btn-primary') + '" type="button" id="complete">' + (done ? '✓ Completed' : 'Mark as completed') + '</button>' : '') +
        (nextHref ? '<a class="btn ' + ((item === 'practice' && !MIM.isDone(l.slug, 'practice')) ? 'btn-ghost' : 'btn-primary') + '" id="next" href="' + nextHref + '">' + (nextLesson ? 'Next lesson →' : 'Next →') + '</a>' : '<a class="btn btn-outline" href="lessons.html">Back to lessons</a>') +
        '</div></div></div>';
      main.innerHTML = html;
      wireOutline();
      MIM_mountVideos();

      if (item === 'practice') {
        var finish = function (correct, total) {
          var g = document.querySelector('[data-score]'), msg = g.querySelector('[data-score-message]');
          var pct = Math.round(correct / total * 100);
          g.classList.toggle('pass', pct >= 80);
          msg.textContent = pct + '%. ' + (pct === 100 ? 'Perfect. Lesson complete.' : pct >= 80 ? 'Passed. The next lesson is open. Read the worked solutions for the ones you missed.' : 'Below 80%. Watch the video again, read the solutions, then try again.');
          if (pct >= 80 && !MIM.isDone(l.slug, 'practice')) { MIM.markDone(l.slug, 'practice'); document.getElementById('outline').outerHTML = outline(l, item, chapterLessons, chapterName, all); wireOutline(); var nx = document.getElementById('next'); if (nx) nx.className = 'btn btn-primary'; }
        };
        var api = MIM_mountQuestions(function (correct, total, answeredCount) {
          var g = document.querySelector('[data-score]'), msg = g.querySelector('[data-score-message]');
          if (answeredCount < total) { msg.textContent = answeredCount + ' of ' + total + ' answered.'; return; }
          finish(correct, total);
        });
        mountMarking(l, function (qEl) { api.setCorrect(parseInt(qEl.getAttribute('data-index'), 10)); });
        document.getElementById('retry').addEventListener('click', function () { render(l, all); });
      }
      var c = document.getElementById('complete');
      if (c) c.addEventListener('click', function () { MIM.markDone(l.slug, item); if (nextHref) location.href = nextHref; else render(l, all); });
      window.scrollTo(0, 0);
    }
    function wireOutline() { var t = document.getElementById('outline-toggle'); if (t) t.onclick = function () { document.getElementById('outline').classList.toggle('open'); }; }

    MIM.loadLessons().then(function (list) {
      var slug = MIM.param('id');
      var l = list.filter(function (x) { return x.slug === slug; })[0] || list.filter(function (x) { return x.status === 'live'; })[0];
      if (!l) { main.innerHTML = '<div class="stage"><h1>No lesson found</h1><p><a href="lessons.html">Back to lessons</a></p></div>'; return; }
      render(l, list);
    });
  })();
  </script>
</body>
</html>
